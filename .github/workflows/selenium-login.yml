name: Selenium E2E Frontend Testing

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      working-directory: frontend
      run: npm install

    - name: Build Frontend Application
      working-directory: frontend
      run: npm run build

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: frontend/build
        branch: gh-pages

    - name: Verify Live Deployment Availability
      run: |
        BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
        echo "Validating availability of deployed site at: $BASE_URL"
        SUCCESS=false
        for i in {1..20}; do
          STATUS_CODE=$(curl -o /dev/null -s -w "%{http_code}" $BASE_URL)
          echo "Check #$i: Status code is $STATUS_CODE"
          if [ "$STATUS_CODE" -eq 200 ]; then
            SUCCESS=true
            break
          fi
          echo "Waiting 12 seconds for deployment to propagate..."
          sleep 12
        done
        if [ "$SUCCESS" = false ]; then
          echo "Deployment check failed: Live URL did not respond with 200 OK after 4 minutes."
          exit 1
        fi
        echo "Deployment is online!"

    - name: Install Selenium Test Runner Dependencies
      working-directory: frontend/selenium-tests
      run: npm install

    - name: Execute Selenium E2E Login Tests
      working-directory: frontend/selenium-tests
      env:
        BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      run: npm run login
